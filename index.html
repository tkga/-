<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#070b09">
  <meta name="color-scheme" content="dark">
  <title>สมุดบัญชีคนขับ</title>
  <meta name="description" content="จดรายรับ-รายจ่ายคนขับแกร็ป แยกกำไรแกร็ปออกจากรายได้เกมและรายได้อื่น ข้อมูลเก็บในเครื่องคุณเท่านั้น">

  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="สมุดคนขับ">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=Pixelify+Sans:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <header class="top">
      <h1>สมุดบัญชีคนขับ</h1>
      <p class="sub"><i class="dot"></i>เก็บในเครื่องของคุณ เห็นได้เฉพาะคุณ</p>
    </header>

    <nav class="tabs" role="tablist" aria-label="เมนูหลัก">
      <button role="tab" data-tab="day">รายวัน</button>
      <button role="tab" data-tab="month">สรุปรายเดือน</button>
      <button role="tab" data-tab="settings">ตั้งค่า</button>
    </nav>

    <main id="view" aria-live="polite"></main>
    <p class="foot">สมุดบัญชีคนขับ · ข้อมูลอยู่ในเบราว์เซอร์เครื่องนี้ ไม่ถูกส่งไปที่ไหน</p>
  </div>

  <div id="toast" role="status"></div>
  <noscript><p style="padding:24px">ต้องเปิด JavaScript ในเบราว์เซอร์ก่อนใช้งานแอปนี้</p></noscript>

  <script src="logic.js"></script>
  <script src="app.js"></script>
</body>
</html>
